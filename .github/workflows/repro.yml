name: repro

on:
  push:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per image
        default: '5'

jobs:
  # Both images run in one job, so they share the same machine and CPU.
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: uname -m && grep -m1 'model name' /proc/cpuinfo
      - run: |
          for distro in resolute noble; do
            docker build -f Dockerfile.microsoft --build-arg DISTRO=$distro -t repro-$distro .
          done
      - name: Run repro
        run: |
          runs=${{ inputs.runs || 5 }}
          declare -A crashes=([resolute]=0 [noble]=0)
          for i in $(seq 1 "$runs"); do
            for distro in resolute noble; do
              log="$distro-run-$i.log"
              docker run --rm --ipc=host -e DEBUG=pw:browser repro-$distro > "$log" 2>&1
              echo "$distro run $i: $(grep -E '^(error|crashed)' "$log" | tr '\n' ' ')"
              grep -q 'crashed=true' "$log" && crashes[$distro]=$((crashes[$distro] + 1))
            done
          done
          for distro in resolute noble; do
            echo "$distro: ${crashes[$distro]} of $runs runs crashed" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: '*-run-*.log'
